AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Row Reduction Calculator Lambda Function

Globals:
  Function:
    Timeout: 30
    MemorySize: 128

Resources:
  RowReductionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - x86_64
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /api/rref
            Method: post
            Cors:
              AllowMethods: "'POST,OPTIONS'"
              AllowHeaders: "'Content-Type'"
              AllowOrigin: "'*'"
        OptionsEvent:
          Type: Api
          Properties:
            Path: /api/rref
            Method: options
            Cors:
              AllowMethods: "'POST,OPTIONS'"
              AllowHeaders: "'Content-Type'"
              AllowOrigin: "'*'"

Outputs:
  RowReductionApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/rref"
  RowReductionFunction:
    Description: "Row Reduction Lambda Function ARN"
    Value: !GetAtt RowReductionFunction.Arn

