name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          # Try npm ci first, fall back to npm install if lock file is out of sync
          npm ci || npm install

      - name: Build React app
        working-directory: ./frontend
        env:
          # Set your Lambda API Gateway URL here
          # Replace with your actual API Gateway endpoint
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'https://your-api-gateway-url.execute-api.region.amazonaws.com/Prod/api/rref' }}
          # Homepage is set in package.json - update it if your repository name is different
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

